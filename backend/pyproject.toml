[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vorquel-watch"
version = "0.1.0a1"
description = "Local-first media analysis core for Vorquel Watch"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "supabase==2.31.0",
]

[project.optional-dependencies]
transcribe = [
  "faster-whisper==1.2.1",
]
# Screen pipeline. The frame timeline, sampling and change detection need
# nothing beyond PyAV and numpy, which transcribe already brings; only OCR
# adds a dependency. Kept as its own extra so a transcript-only install stays
# small.
screen = [
  "rapidocr==3.9.2",
]
[project.scripts]
vorquel-watch = "vorquel_watch.cli:main"
vorquel-watch-mcp = "vorquel_watch.mcp_server:main"
vorquel-watch-worker = "vorquel_watch.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vorquel_watch"]
