name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  python-and-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Install the reviewed, hash-pinned dependency set rather than letting
      # pip resolve freely, then the package itself without re-resolving.
      # The media runtime comes with the lock on purpose: the Source Guard tests
      # (duration regression, container allowlist, host-path leakage) need av,
      # and without it unittest silently skips the whole suite.
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -e backend --no-deps

      - name: Dependency check
        run: python -m pip check

      - name: Compile
        run: python -m compileall -q backend/src backend/tests scripts

      - name: Media runtime must be importable
        run: python -c "import av, faster_whisper"

      # The Source Guard suite self-skips when av is missing, so a dropped media
      # runtime would silently retire the duration and container-allowlist
      # regression tests instead of breaking the build. Only that class of skip
      # is fatal: the DPAPI credential tests skip legitimately on Linux, and a
      # blanket skips-are-failures rule would break CI for the wrong reason.
      - name: Unit tests (media skips are failures)
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "backend/tests", pattern="test_*.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          blocked = [
              (test, reason)
              for test, reason in result.skipped
              if "media runtime" in reason
          ]
          for test, reason in blocked:
              print(f"SKIPPED {test}: {reason}", file=sys.stderr)
          if blocked:
              sys.exit("media-dependent tests must not skip in CI")
          if not result.wasSuccessful():
              sys.exit("tests failed")
          PY

      - name: Repository security policy
        run: python scripts/security/check_repo.py


  transcription-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install transcription runtime
        run: python -m pip install -e "backend[transcribe]"

      - name: Verify runtime imports and CLI
        run: |
          python -c "import av, faster_whisper, vorquel_watch.mcp_server"
          python -m vorquel_watch.cli --help

      - name: Dependency check
        run: python -m pip check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Both tools are pinned. An unpinned security tool is its own
      # supply-chain gap.
      - name: Install audit tooling
        run: python -m pip install "pip-tools==7.6.1" "pip-audit==2.10.1"

      # A lock that has drifted from pyproject silently stops protecting
      # anything, because the set that gets installed is no longer the set that
      # was reviewed and audited.
      - name: Lock is in sync with pyproject
        run: |
          python -m piptools compile --generate-hashes --strip-extras \
            --extra transcribe --quiet \
            --output-file /tmp/expected.lock backend/pyproject.toml
          grep -v '^[[:space:]]*#' backend/requirements.lock > /tmp/current.clean
          grep -v '^[[:space:]]*#' /tmp/expected.lock > /tmp/expected.clean
          if ! diff -u /tmp/current.clean /tmp/expected.clean; then
            echo "backend/requirements.lock is out of date. Regenerate it:"
            echo "  pip-compile --generate-hashes --strip-extras --extra transcribe \\"
            echo "    --output-file backend/requirements.lock backend/pyproject.toml"
            exit 1
          fi

      # pip check is a compatibility check, not a vulnerability scanner. This is
      # the vulnerability scanner.
      - name: Vulnerability audit of the locked set
        run: |
          python -m pip_audit --requirement backend/requirements.lock \
            --progress-spinner off

      - name: Generate SBOM
        run: |
          python -m pip_audit --requirement backend/requirements.lock \
            --format=cyclonedx-json --output sbom.cyclonedx.json \
            --progress-spinner off
          python - <<'PY'
          import json
          with open("sbom.cyclonedx.json", encoding="utf-8") as handle:
              sbom = json.load(handle)
          print(sbom["bomFormat"], sbom["specVersion"],
                len(sbom["components"]), "components")
          PY
