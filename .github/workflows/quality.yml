name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  python-and-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The media runtime is installed here on purpose: the Source Guard tests
      # (duration regression, container allowlist, host-path leakage) need av,
      # and without it unittest silently skips the whole suite.
      - name: Install package with media runtime
        run: python -m pip install -e "backend[transcribe]"

      - name: Dependency check
        run: python -m pip check

      - name: Compile
        run: python -m compileall -q backend/src backend/tests scripts

      # A skip is a failure here. The Source Guard suite self-skips when av is
      # missing, so a dropped media runtime would silently retire the duration
      # and container-allowlist regression tests instead of breaking the build.
      - name: Unit tests (skips are failures)
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover(
              "backend/tests", pattern="test_*.py"
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              for test, reason in result.skipped:
                  print(f"SKIPPED {test}: {reason}", file=sys.stderr)
              sys.exit("media-dependent tests must not skip in CI")
          if not result.wasSuccessful():
              sys.exit("tests failed")
          PY

      - name: Repository security policy
        run: python scripts/security/check_repo.py


  transcription-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install transcription runtime
        run: python -m pip install -e "backend[transcribe]"

      - name: Verify runtime imports and CLI
        run: |
          python -c "import av, faster_whisper, vorquel_watch.mcp_server"
          python -m vorquel_watch.cli --help

      - name: Dependency check
        run: python -m pip check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
