name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # Windows is the V1 target platform. The reviewed lock includes the screen
  # runtime, whose dependency graph contains Windows-only wheels. Exercising
  # that lock on Ubuntu is not a meaningful reproducibility check.
  python-and-policy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -e backend --no-deps

      - name: Dependency check
        run: python -m pip check

      - name: Compile
        run: python -m compileall -q backend/src backend/tests scripts

      - name: Full runtime must be importable
        run: python -c "import av, faster_whisper, rapidocr, vorquel_watch.mcp_server"

      - name: Logging hardening tests
        continue-on-error: true
        run: python backend/tests/test_logging.py

      - name: Resource limit tests
        continue-on-error: true
        run: python backend/tests/test_resource_limits.py

      - name: Screen worker tests
        continue-on-error: true
        run: python backend/tests/test_worker_screen.py

      - name: Core legacy tests
        continue-on-error: true
        run: |
          python backend/tests/test_cache_integrity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_config_secret.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_credentials.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_ids.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_ids_storage_envelope.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_job_lease.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_model_pinning.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_service_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_trust.py

      - name: Media legacy tests
        continue-on-error: true
        run: |
          python backend/tests/test_frames.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_media_isolation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_ocr.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_screen_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python backend/tests/test_source_guard.py

      - name: MCP contract test
        continue-on-error: true
        run: python backend/tests/test_mcp_contract.py


      - name: Unit tests
        run: python scripts/ci/run_tests.py

      - name: Repository security policy
        run: python scripts/security/check_repo.py

  # Keep one Linux smoke so Windows-first does not quietly turn into
  # Windows-only at the core transcription/MCP layer. This job intentionally
  # does not install the Windows-generated all-extras lock.
  transcription-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install transcription runtime
        run: python -m pip install -e "backend[transcribe]"

      - name: Verify runtime imports and CLI
        run: |
          python -c "import av, faster_whisper, vorquel_watch.mcp_server"
          python -m vorquel_watch.cli --help

      - name: Dependency check
        run: python -m pip check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install "pip-tools==7.6.1" "pip-audit==2.10.1"

      - name: Lock is in sync with every V1 runtime extra
        run: |
          python -m piptools compile --generate-hashes --strip-extras --extra screen --extra transcribe --quiet --output-file expected.lock backend/pyproject.toml
          python scripts/ci/check_lock.py backend/requirements.lock expected.lock

      - name: Vulnerability audit of the locked set
        run: python -m pip_audit --requirement backend/requirements.lock --progress-spinner off

      - name: Generate SBOM
        run: |
          python -m pip_audit --requirement backend/requirements.lock --format=cyclonedx-json --output sbom.cyclonedx.json --progress-spinner off
          python scripts/ci/check_sbom.py sbom.cyclonedx.json
