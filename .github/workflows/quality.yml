name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # Windows is the V1 target platform. The reviewed lock includes the screen
  # runtime, whose dependency graph contains Windows-only wheels. Exercising
  # that lock on Ubuntu is not a meaningful reproducibility check.
  python-and-policy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -e backend --no-deps

      - name: Dependency check
        run: python -m pip check

      - name: Compile
        run: python -m compileall -q backend/src backend/tests scripts

      - name: Full runtime must be importable
        run: python -c "import av, faster_whisper, rapidocr, vorquel_watch.mcp_server"

      - name: Unit tests (isolated modules)
        run: python scripts/ci/run_tests.py

      - name: Repository security policy
        run: python scripts/security/check_repo.py

  # Keep one Linux smoke so Windows-first does not quietly turn into
  # Windows-only at the core transcription/MCP layer. This job intentionally
  # does not install the Windows-generated all-extras lock.
  transcription-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install transcription runtime
        run: python -m pip install -e "backend[transcribe]"

      - name: Verify runtime imports and CLI
        run: |
          python -c "import av, faster_whisper, vorquel_watch.mcp_server"
          python -m vorquel_watch.cli --help

      - name: Dependency check
        run: python -m pip check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install "pip-tools==7.6.1" "pip-audit==2.10.1"

      - name: Lock is in sync with every V1 runtime extra
        run: |
          python -m piptools compile --generate-hashes --strip-extras --extra screen --extra transcribe --quiet --output-file expected.lock backend/pyproject.toml
          python scripts/ci/check_lock.py backend/requirements.lock expected.lock

      - name: Vulnerability audit of the locked set
        run: python -m pip_audit --requirement backend/requirements.lock --progress-spinner off

      - name: Generate SBOM
        run: |
          python -m pip_audit --requirement backend/requirements.lock --format=cyclonedx-json --output sbom.cyclonedx.json --progress-spinner off
          python scripts/ci/check_sbom.py sbom.cyclonedx.json

  # The knowledge store is the part of this repo the n8n Brain reads through.
  # Until now no job applied a migration anywhere, so a schema regression could
  # only be found by applying it live. This job applies the whole set to a
  # disposable PostgreSQL and asserts the isolation, review and versioning
  # invariants. It never touches the managed project.
  knowledge-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap Supabase-provisioned roles
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql

      - name: Apply every migration in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/[0-9]*.sql; do
            echo "== $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Scope isolation, review gate and source versioning
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/knowledge_scope_and_external_sources.sql

      - name: Migrations are re-appliable
        shell: bash
        run: |
          set -euo pipefail
          # 0021/0022/0023 are the ones that will be applied to a project that
          # already has rows, so they must be safe to run twice.
          for migration in \
            supabase/migrations/0021_knowledge_scope_and_generic_provenance.sql \
            supabase/migrations/0022_scoped_knowledge_retrieval.sql \
            supabase/migrations/0023_external_sources_and_scoped_candidates.sql \
            supabase/migrations/0024_restrict_scoped_knowledge_rpc_execution.sql; do
            echo "== re-apply $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
